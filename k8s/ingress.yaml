apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/component: ingress
  annotations:
    # Use nginx ingress class (installed in kind via helm in the runbook)
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Enable CORS at the ingress level
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # Rate limiting: max 100 req/s per IP to protect the API
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: task-manager.local   # add to /etc/hosts: 127.0.0.1 task-manager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-manager
                port:
                  name: http
