apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-manager-netpol
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: task-manager

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow inbound HTTP traffic from the nginx-ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP

    # Allow Prometheus to scrape /metrics from the monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP

  egress:
    # Allow DNS resolution (required for any outbound traffic)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow MongoDB connections (Atlas: 27017 over TCP)
    # Uncomment when MongoDB is enabled:
    # - ports:
    #     - port: 27017
    #       protocol: TCP

    # Allow OTLP traces to a collector in the monitoring namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4318   # OTLP HTTP
          protocol: TCP
