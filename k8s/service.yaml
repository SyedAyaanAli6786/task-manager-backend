apiVersion: v1
kind: Service
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/component: api
spec:
  # ClusterIP: internal-only. Traffic enters via Ingress, not directly from outside.
  # This avoids exposing the service externally and lets Ingress handle TLS/routing.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: task-manager
  ports:
    - name: http
      port: 80
      targetPort: http    # references containerPort named 'http' = 8080
      protocol: TCP
