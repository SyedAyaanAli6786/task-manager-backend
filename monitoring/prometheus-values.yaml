# prometheus-values.yaml
# Helm values for kube-prometheus-stack
# Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f monitoring/prometheus-values.yaml

grafana:
  adminPassword: "admin"   # change in production — set via secret
  service:
    type: NodePort
    nodePort: 32000         # access Grafana at http://localhost:32000 on kind

prometheus:
  prometheusSpec:
    # Scrape interval — how often Prometheus polls /metrics endpoints
    scrapeInterval: "15s"
    evaluationInterval: "15s"

    # Auto-discover pods annotated with prometheus.io/scrape: "true"
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

    additionalScrapeConfigs:
      # Direct pod scrape for task-manager pods using annotations
      - job_name: 'task-manager-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['task-manager']
        relabel_configs:
          # Only scrape pods annotated with prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Use the annotated path (default /metrics)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Use the annotated port (default 8080)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Carry over pod labels as metric labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

alertmanager:
  alertmanagerSpec:
    # In production: configure receivers (PagerDuty, Slack, email) here
    # For local dev, alerts are visible in the Alertmanager UI only
    routeConfig:
      routes: []
