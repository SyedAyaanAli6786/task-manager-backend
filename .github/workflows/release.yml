name: Release — Tag, Build, and GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on semantic version tags: v1.0.0, v1.2.3, etc.

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write      # needed to create GitHub releases
      packages: write
      security-events: write

    steps:
      # ── 1. Checkout with full history (for changelog generation) ──────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate changelog

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Run tests (must pass before a release is cut) ──────────────────
      - name: Run tests
        run: npm test

      # ── 4. Extract version from tag ───────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # ── 5. Docker login ───────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 6. Build and push with semver tags ────────────────────────────────
      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 7. Generate changelog from git log ────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          else
            CHANGES=$(git log --oneline --no-merges)
          fi
          # Write changelog to a file (multiline safe)
          {
            echo "## What's Changed"
            echo ""
            echo "${CHANGES}" | while IFS= read -r line; do echo "- ${line}"; done
            echo ""
            echo "## Docker Image"
            echo "\`\`\`"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:${{ steps.version.outputs.version }}"
            echo "\`\`\`"
          } > changelog.md
          cat changelog.md

      # ── 8. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          # e.g. v1.0.0-rc.1 is automatically marked pre-release
